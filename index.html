<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Document Server</title>
    <style>
        body {
            background-color: #1e2d4a;
            color: #ffffff;
            font-family: Georgia, 'Times New Roman', serif;
            margin: 0;
            padding: 3rem 2rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .left-col h1 {
            font-size: 3rem;
            text-decoration: underline;
            margin-bottom: 1.5rem;
        }

        .left-col h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .left-col p {
            line-height: 1.7;
            font-size: 1.1rem;
            color: #d1d5db;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 1rem;
        }

        label span {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        input, textarea {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            background-color: #ffffff;
            color: #1e2d4a;
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: fit-content;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Info Column -->
        <div class="left-col">
            <h1>Book Document server</h1>
            <h3>Ready to get started?</h3>
            <p>Reach out today to book your service</p>
            <p>Expect a call—because when you contact document server Solutions, you're not just sending a form... you're starting a relationship..</p>
        </div>

        <!-- Right Form Column -->
        <div class="right-col">
            <form action="/.netlify/functions/send-sms" method="POST">
                <div>
                    <label>Name</label>
                    <div class="name-row">
                        <div>
                            <input type="text" name="firstName" required>
                            <label style="font-size: 0.8rem; margin-top: 0.2rem;">First Name</label>
                        </div>
                        <div>
                            <input type="text" name="lastName" required>
                            <label style="font-size: 0.8rem; margin-top: 0.2rem;">Last Name</label>
                        </div>
                    </div>
                </div>

                <div>
                    <label>Phone</label>
                    <input type="tel" name="phone">
                </div>

                <div>
                    <label>Email <span>(required)</span></label>
                    <input type="email" name="email" required>
                </div>

                <div>
                    <label>Message <span>(required)</span></label>
                    <textarea name="message" rows="5" required></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </div>
    </div>

</body>
</html>
